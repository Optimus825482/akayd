services:
  akaydin-tarim:
    build: .
    container_name: akaydin-tarim
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3003}:3003"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=127.0.0.1
      - DB_PORT=5432
    volumes:
      - pg_data:/app/data
      - uploads_data:/app/uploads
      - public_data:/app/public

volumes:
  pg_data:
  uploads_data:
  public_data:
