# ============================================
# Akaydın Tarım — Coolify 3-Container Compose
#   postgres (db) | backend (api) | frontend (nginx + static)
# Coolify traefik ile domain yönetimi yapar.
# ============================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: akaydin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: ${DB_NAME:-akaydin_tarim}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-akaydin_tarim}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - akaydin_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: akaydin-backend:latest
    container_name: akaydin-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - PORT=3003
    volumes:
      - /data/akaydin/uploads:/app/uploads
      - /data/akaydin/gsc-key.json:/etc/gsc-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - akaydin_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: akaydin-frontend:latest
    container_name: akaydin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - akaydin_net
    # Coolify bu servisi Traefik üzerinden akaydintarim.com.tr'ye yönlendirir
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.akaydin-frontend.rule=Host(`akaydintarim.com.tr`) || Host(`www.akaydintarim.com.tr`)"
      - "traefik.http.routers.akaydin-frontend.entrypoints=websecure"
      - "traefik.http.routers.akaydin-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.akaydin-frontend.loadbalancer.server.port=80"

volumes:
  pg_data:

networks:
  akaydin_net:
    driver: bridge
