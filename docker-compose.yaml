# ============================================
# Akaydın Tarım — Coolify 3-Container Compose
# Her servis (postgres + backend + frontend) ayrı container
# ============================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: akaydin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: ${DB_NAME:-akaydin_tarim}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-akaydin_tarim}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - akaydin_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: akaydin-backend:latest
    container_name: akaydin-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - PORT=3003
    volumes:
      - uploads_data:/app/uploads
      - public_data:/app/public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - akaydin_net
    expose:
      - "3003"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: akaydin-frontend:latest
    container_name: akaydin-frontend
    restart: unless-stopped
    volumes:
      - uploads_data:/var/www/uploads:ro
      - public_data:/var/www/public:ro
    depends_on:
      - backend
    networks:
      - akaydin_net
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  pg_data:
  uploads_data:
  public_data:

networks:
  akaydin_net:
    driver: bridge
