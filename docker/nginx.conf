server {
    listen 80;
    server_name akaydintarim.com.tr www.akaydintarim.com.tr _;

    # Maksimum yükleme boyutu (görseller için 20MB)
    client_max_body_size 20M;
    client_body_buffer_size 20M;

    # Statik frontend (Vite build çıktısı)
    root /usr/share/nginx/html;
    index index.html;

    # P2-7: Güvenlik header'ları (helmet backend'i korur, frontend nginx'ten gelir)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA fallback — tüm route'ları index.html'e yönlendir
    # P2-7: index.html asla cache'lenmez (stale SPA shell + eski chunk hash 404)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # API → backend container
    location /api/ {
        proxy_pass http://backend:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # XFF'i OVERWRITE et (append değil) — client spoof'lamasın, rate limit req.ip güvenilir olsun
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Sitemap ve robots.txt → backend
    location = /sitemap.xml {
        proxy_pass http://backend:3003;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://backend:3003;
        proxy_set_header Host $host;
    }

    # Upload'lar → backend (buffering kapalı, cache kapalı)
    location /uploads/ {
        proxy_pass http://backend:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # Cache assets (uploads HARİÇ)
    location ~* \.(js|css|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
